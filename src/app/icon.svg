<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b2546"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff9f0a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ff9f0a"/>
    </linearGradient>
    <pattern id="stripes" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="72" height="72" fill="#16131f"/>
      <rect width="36" height="72" fill="#fff6dc"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <!-- corpo del ciak -->
  <rect x="104" y="236" width="304" height="176" rx="26" fill="url(#body)"/>
  <rect x="104" y="236" width="304" height="58" rx="14" fill="url(#stripes)"/>
  <rect x="104" y="280" width="304" height="14" fill="url(#body)"/>
  <!-- righe della lavagnetta -->
  <rect x="140" y="326" width="150" height="14" rx="7" fill="#16131f" opacity=".55"/>
  <rect x="140" y="358" width="104" height="14" rx="7" fill="#16131f" opacity=".35"/>
  <!-- asta superiore aperta -->
  <g transform="rotate(-16 112 222)">
    <rect x="104" y="166" width="304" height="58" rx="14" fill="url(#stripes)"/>
  </g>
  <circle cx="118" cy="226" r="14" fill="#ffe066"/>
  <circle cx="118" cy="226" r="6" fill="#16131f"/>
</svg>
